<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Activar acceso · Administrador</title><link rel="stylesheet" href="login.css"><script src="acceso.js"></script><script src="vendor/bcrypt-3.0.2.js"></script></head>
<body><main class="setup"><span class="eyebrow">ACTIVACIÓN INICIAL</span><h1>Crear el primer usuario</h1><p>El usuario quedará guardado directamente en Apps Script. Una vez creado, podrás ingresar al sistema.</p>
<form id="setup"><label for="user">Usuario</label><input id="user" required pattern="[a-zA-Z0-9._-]{3,60}" autocomplete="username"><label for="name">Nombre para mostrar</label><input id="name" required maxlength="80"><label for="pass">Contraseña (mínimo 12 caracteres)</label><input id="pass" type="password" required minlength="12" autocomplete="new-password"><label for="confirm">Repite la contraseña</label><input id="confirm" type="password" required autocomplete="new-password"><p id="status" role="status" aria-live="polite"></p><button class="primary">Crear usuario y guardar</button></form><section id="output" hidden><h2>Acceso activado</h2><p>Tu usuario fue guardado en Apps Script.</p><a class="primary" href="login.html">Ir a iniciar sesión</a></section></main><script src="configurar-acceso.js"></script></body></html>
