<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Correos enviados</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<style>
:root{--ink:#173f52;--muted:#637785;--line:#dce5e8;--accent:#d96b2b;--pale:#f3f7f8}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#eaf1f3,#f7f9f9);color:#243942;font-family:Barlow,Arial,sans-serif}.topbar{background:#fff;border-bottom:1px solid var(--line);box-shadow:0 3px 14px #173f5212}.topbar-inner{max-width:1180px;margin:auto;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;align-items:center;gap:11px;color:var(--ink)}.brand i{font-size:25px;color:var(--accent)}.brand strong{display:block;font:700 22px/1 "Barlow Condensed",Arial}.brand span{display:block;color:var(--muted);font-size:11px;margin-top:4px}.button{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--ink);border-radius:5px;background:var(--ink);color:#fff;text-decoration:none;padding:9px 13px;font:600 13px Barlow;cursor:pointer}.button.light{background:#fff;color:var(--ink);border-color:var(--line)}main{max-width:1180px;margin:28px auto;padding:0 24px}.intro h1{margin:0;color:var(--ink);font:700 32px/1 "Barlow Condensed",Arial}.intro p{margin:7px 0 18px;color:var(--muted);font-size:14px}.searchbar{background:#fff;border:1px solid var(--line);padding:14px;display:flex;gap:9px;box-shadow:0 5px 18px #173f5210}.searchbar input{flex:1;min-width:0;border:1px solid #cbd8dd;border-radius:5px;padding:10px 12px;font:400 15px Barlow;outline:0}.status{min-height:22px;padding:10px 2px;color:var(--muted);font-size:13px}.table-wrap{background:#fff;border:1px solid var(--line);overflow:auto;box-shadow:0 5px 18px #173f5210}.sent-table{width:100%;border-collapse:collapse;min-width:850px;font-size:13px}.sent-table th{background:var(--pale);color:#52717b;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px}.sent-table th,.sent-table td{padding:11px 12px;border-bottom:1px solid #e5ecee;vertical-align:top}.sent-table tr:last-child td{border-bottom:0}.sent-table tr:hover td{background:#fbfcfc}.sent-table a{color:#216b82;font-weight:600;text-decoration:none}.sent-table a:hover{text-decoration:underline}.sent{color:#237a5a;font-weight:700}.empty{text-align:center;padding:34px;color:var(--muted)}@media(max-width:700px){.topbar-inner{padding:14px 16px}.brand strong{font-size:19px}.topbar .button span{display:none}main{margin:20px auto;padding:0 16px}.intro h1{font-size:28px}.searchbar{padding:10px}}
</style>
<style>.nav-links{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}@media(max-width:640px){.topbar-inner{align-items:flex-start;flex-direction:column}.nav-links{width:100%;justify-content:flex-start}}</style>
<style>
body{background:#eef3f5;color:#263940}.topbar{background:#102f3d;color:#fff;border-bottom:3px solid #c85f24;box-shadow:0 8px 22px rgba(16,47,61,.22)}.topbar-inner{max-width:1280px;padding:14px 28px}.brand{color:#fff}.brand i{color:#e7a168}.brand strong{letter-spacing:0}.brand span{color:#c4d6dc}.button{border-radius:5px;background:#c85f24;border-color:#c85f24;font-weight:700}.button:hover{background:#ad501d;border-color:#ad501d}.button.light{background:#173f52;color:#fff;border-color:#6f9bab}.button.light:hover{background:#25596c;color:#fff}main{max-width:1280px;margin:30px auto;padding:0 28px}.intro{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:16px}.intro h1{color:#133746;letter-spacing:0}.intro p{color:#637783}.searchbar{border:1px solid #d6e1e5;border-radius:8px;box-shadow:0 14px 34px rgba(31,74,88,.09);padding:16px;background:#fff}.searchbar input{border-radius:5px;border-color:#c9d6db;background:#fff}.searchbar input:focus{border-color:#2f7a94;box-shadow:0 0 0 3px rgba(47,122,148,.14)}.status{color:#637783}.table-wrap{border:1px solid #d6e1e5;border-radius:8px;box-shadow:0 14px 34px rgba(31,74,88,.09);background:#fff}.sent-table th{background:#edf4f6;color:#425d68;letter-spacing:.55px}.sent-table th,.sent-table td{border-bottom-color:#e3ebee}.sent-table tr:hover td{background:#f8fbfc}.sent-table a{color:#1f5b70}.sent{color:#207456}.empty{color:#637783}@media(max-width:700px){.topbar-inner{padding:14px 16px}main{padding:0 16px}.intro{align-items:flex-start;flex-direction:column}.searchbar{display:grid;grid-template-columns:1fr auto;gap:8px}}
</style>
</head>
<body>
<header class="topbar"><div class="topbar-inner"><div class="brand"><i class="bi bi-envelope-check"></i><div><strong>Correos enviados</strong><span>Seguimiento de informes remitidos</span></div></div><div class="nav-links"><a class="button light" href="home.html"><i class="bi bi-house-door-fill"></i><span>Inicio</span></a><a class="button light" href="index.html"><i class="bi bi-file-earmark-plus"></i><span>Nuevo informe</span></a></div></div></header>
<main><div class="intro"><h1>Seguimiento de envíos</h1><p>Consulta cuándo fue enviado cada informe y descarga su PDF.</p></div><div class="searchbar"><input id="query" type="search" placeholder="Buscar por número, destinatario o asunto" autofocus><button class="button" id="searchButton" type="button"><i class="bi bi-search"></i><span>Buscar</span></button></div><div class="status" id="status" role="status">Cargando envíos...</div><div class="table-wrap"><div id="results" class="empty">Consultando correos enviados...</div></div></main>
<script>
const APPS_SCRIPT_URL='https://script.google.com/macros/s/AKfycbwA_j2rMVnbd6pmN1rm0bol-NbGNuGnEWAvNasFpUm9DvxHFhnv55XAU1RXoHHISKcd/exec';
const query=document.getElementById('query'),status=document.getElementById('status'),results=document.getElementById('results');
function escapeHtml(value){return String(value||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function reportPreviewUrl(record,download=false){const params=new URLSearchParams({verInforme:'1',numero:record.numero||'',pdf:record.pdf||''});if(record.recordRow)params.set('registro',record.recordRow);if(download)params.set('descargar','1');return 'index.html?'+params.toString();}
function loadSent(){
 status.textContent='Consultando correos enviados...';results.className='empty';results.textContent='Cargando...';
 fetch(`${APPS_SCRIPT_URL}?action=sent&q=${encodeURIComponent(query.value.trim())}`).then(response=>response.json()).then(data=>{
  if(!data.ok)throw new Error(data.error||'No se pudo consultar los envíos.');
  if(!Array.isArray(data.records))throw new Error('Actualiza la implementación de Apps Script con el Code.gs actualizado.');
  status.textContent=`${data.total} envío(s) encontrado(s).`;
  if(!data.records.length){results.textContent='Todavía no hay correos enviados desde el sistema.';return}
  results.className='';results.innerHTML=`<table class="sent-table"><thead><tr><th>Fecha de envío</th><th>Informe</th><th>Destinatarios</th><th>Asunto</th><th>Estado</th><th>PDF</th><th>Reenviar</th></tr></thead><tbody>${data.records.map(record=>`<tr><td>${escapeHtml(record.fecha)}</td><td><strong>${escapeHtml(record.numero)}</strong></td><td>${escapeHtml(record.destinatarios)}</td><td>${escapeHtml(record.asunto)}</td><td><span class="sent"><i class="bi bi-check-circle-fill"></i> ${escapeHtml(record.estado)}</span></td><td>${record.pdf?`<a href="${escapeHtml(reportPreviewUrl(record))}" target="_blank" rel="noopener">Vista previa / Imprimir</a><br><a href="${escapeHtml(reportPreviewUrl(record,true))}" target="_blank" rel="noopener"><i class="bi bi-file-earmark-pdf"></i> Descargar</a>`:'No disponible'}</td><td><button type="button" class="resend-button" data-resend-numero="${escapeHtml(record.numero)}" data-resend-pdf="${escapeHtml(record.pdf||'')}" data-resend-row="${escapeHtml(record.recordRow||'')}">Reenviar</button></td></tr>`).join('')}</tbody></table>`;
 }).catch(error=>{status.textContent='No se pudo consultar los envíos.';results.className='empty';results.textContent=error.message});
}
document.getElementById('searchButton').addEventListener('click',loadSent);query.addEventListener('keydown',event=>{if(event.key==='Enter')loadSent()});loadSent();
</script>
<script src="reenvio.js" defer></script>
</body>
</html>
