<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Historial de informes técnicos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<style>
:root{--ink:#173f52;--muted:#637785;--line:#dce5e8;--accent:#d96b2b;--pale:#f3f7f8}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#eaf1f3,#f7f9f9);color:#243942;font-family:Barlow,Arial,sans-serif}.topbar{background:#fff;border-bottom:1px solid var(--line);box-shadow:0 3px 14px #173f5212}.topbar-inner{max-width:1180px;margin:auto;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;align-items:center;gap:11px;color:var(--ink)}.brand i{font-size:25px;color:var(--accent)}.brand strong{display:block;font:700 22px/1 "Barlow Condensed",Arial}.brand span{display:block;color:var(--muted);font-size:11px;margin-top:4px}.button{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--ink);border-radius:5px;background:var(--ink);color:#fff;text-decoration:none;padding:9px 13px;font:600 13px Barlow;cursor:pointer}.button.light{background:#fff;color:var(--ink);border-color:var(--line)}main{max-width:1180px;margin:28px auto;padding:0 24px}.intro{margin-bottom:18px}.intro h1{margin:0;color:var(--ink);font:700 32px/1 "Barlow Condensed",Arial}.intro p{margin:7px 0 0;color:var(--muted);font-size:14px}.searchbar{background:#fff;border:1px solid var(--line);padding:14px;display:flex;gap:9px;box-shadow:0 5px 18px #173f5210}.searchbar input{flex:1;min-width:0;border:1px solid #cbd8dd;border-radius:5px;padding:10px 12px;font:400 15px Barlow;outline:0}.searchbar input:focus{border-color:#4e91a8;box-shadow:0 0 0 3px #4e91a822}.status{min-height:22px;padding:10px 2px;color:var(--muted);font-size:13px}.table-wrap{background:#fff;border:1px solid var(--line);overflow:auto;box-shadow:0 5px 18px #173f5210}.history-table{width:100%;border-collapse:collapse;min-width:920px;font-size:13px}.history-table th{background:var(--pale);color:#52717b;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px}.history-table th,.history-table td{padding:11px 12px;border-bottom:1px solid #e5ecee;vertical-align:top}.history-table tr:last-child td{border-bottom:0}.history-table tr:hover td{background:#fbfcfc}.history-table small{color:var(--muted)}.history-table a{color:#216b82;font-weight:600;text-decoration:none}.history-table a:hover{text-decoration:underline}.empty{text-align:center;padding:34px;color:var(--muted)}@media(max-width:700px){.topbar-inner{align-items:flex-start;padding:14px 16px}.brand strong{font-size:19px}.topbar .button span{display:none}main{margin:20px auto;padding:0 16px}.intro h1{font-size:28px}.searchbar{padding:10px}.searchbar .button{padding:10px}.searchbar .button span{display:none}}
</style>
<style>.nav-links{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}@media(max-width:640px){.topbar-inner{align-items:flex-start;flex-direction:column}.nav-links{width:100%;justify-content:flex-start}}</style>
</head>
<body>
<header class="topbar"><div class="topbar-inner"><div class="brand"><i class="bi bi-clock-history"></i><div><strong>Historial de informes</strong><span>Consulta de mantenimiento e infraestructura</span></div></div><div class="nav-links"><a class="button light" href="home.html"><i class="bi bi-house-door-fill"></i><span>Inicio</span></a><a class="button light" href="index.html"><i class="bi bi-file-earmark-plus"></i><span>Nuevo informe</span></a></div></div></header>
<main><div class="intro"><h1>Informes anteriores</h1><p>Consulta los registros guardados y abre sus evidencias fotográficas.</p></div><div class="searchbar"><input id="query" type="search" placeholder="Buscar por número, fecha, peaje o novedad" autofocus><button class="button" id="searchButton" type="button"><i class="bi bi-search"></i><span>Buscar</span></button><button class="button light" id="regenerateButton" type="button" title="Regenerar PDFs guardados"><i class="bi bi-arrow-repeat"></i><span>Regenerar PDFs</span></button></div><div class="status" id="status" role="status">Cargando informes...</div><div class="table-wrap"><div id="results" class="empty">Consultando registros guardados...</div></div></main>
<script>
const APPS_SCRIPT_URL='https://script.google.com/macros/s/AKfycbyq0PyY5yHN4P4tKdOafIfIiCPFarPeD7F3PwQXu1nKcMCvGClhhDbVnseYA2s0v5ZsVw/exec';
const query=document.getElementById('query');
const status=document.getElementById('status');
const results=document.getElementById('results');
function escapeHtml(value){return String(value||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function previewUrl(value){const match=String(value||'').match(/[-\w]{25,}/);return match?`https://drive.google.com/file/d/${match[0]}/preview`:value}
function loadHistory(){
 const text=query.value.trim();status.textContent='Consultando informes guardados...';results.className='empty';results.textContent='Cargando...';
 fetch(`${APPS_SCRIPT_URL}?action=history&q=${encodeURIComponent(text)}`).then(response=>response.json()).then(data=>{
    if(!data.ok)throw new Error(data.error||'No se pudo consultar el historial.');
    if(!Array.isArray(data.records))throw new Error('La implementación de Apps Script aún no tiene habilitada la consulta de historial. Copia el Code.gs actualizado y crea una nueva versión.');
    status.textContent=`${data.total} informe(s) encontrado(s).`;
    if(!data.records.length){results.className='empty';results.textContent='No hay informes que coincidan con la búsqueda.';return}
  results.className='';results.innerHTML=`<table class="history-table"><thead><tr><th>Número</th><th>Fecha y hora</th><th>Peaje</th><th>Novedad</th><th>Estado</th><th>Responsable</th><th>Evidencias</th><th>PDF</th></tr></thead><tbody>${data.records.map(record=>`<tr><td><strong>${escapeHtml(record.numero)}</strong></td><td>${escapeHtml(record.fecha)}<br><small>${escapeHtml(record.hora)}</small></td><td>${escapeHtml(record.peaje)}</td><td>${escapeHtml(record.novedad)}<br><small>${escapeHtml(record.ubicacion)}</small></td><td>${escapeHtml(record.estado)}</td><td>${escapeHtml(record.responsable)}</td><td>${record.fotos?record.fotos.split('\\n').filter(Boolean).map((link,index)=>`<a href="${escapeHtml(link)}" target="_blank" rel="noopener">Foto ${index+1}</a>`).join(' · '):'Sin fotos'}</td><td>${record.pdf?`<a href="${escapeHtml(previewUrl(record.pdf))}" target="_blank" rel="noopener"><i class="bi bi-eye"></i> Vista previa</a><br><a href="${escapeHtml(record.pdf)}" target="_blank" rel="noopener"><i class="bi bi-download"></i> Descargar</a>`:'No disponible'}</td></tr>`).join('')}</tbody></table>`;
 }).catch(error=>{status.textContent='No se pudo consultar el historial.';results.className='empty';results.textContent=error.message+' Actualiza la implementación de Apps Script si acabas de cambiar Code.gs.'});
}
function regeneratePdfs(){
 status.textContent='Regenerando PDFs desde los datos guardados...';
 fetch(`${APPS_SCRIPT_URL}?action=regenerate&q=${encodeURIComponent(query.value.trim())}`).then(response=>response.json()).then(data=>{
  if(!data.ok)throw new Error(data.error||'No se pudieron regenerar los PDFs.');
  status.textContent=data.message+' Actualizando historial...';loadHistory();
 }).catch(error=>{status.textContent=error.message+' Actualiza la implementación de Apps Script.'});
}
document.getElementById('searchButton').addEventListener('click',loadHistory);document.getElementById('regenerateButton').addEventListener('click',regeneratePdfs);query.addEventListener('keydown',event=>{if(event.key==='Enter')loadHistory()});loadHistory();
</script>
</body>
</html>
